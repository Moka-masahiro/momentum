# 毎日の更新: 全銘柄の日足を取り直して計算し、暗号化したデータと画面を GitHub Pages に置く。
# PC の電源は要らない。失敗した日は公開を行わないので、前日のデータがそのまま残る。
name: daily

on:
  # 決まった時刻の実行は、外部のタイマー（timer/timer.gs。Google Apps Script）が workflow_dispatch（auto=true）で頼む。
  #   平日 11:53 JST: 前場の引け（11:30）のあと。Yahoo の値は20分ほど遅れるので11時50分過ぎにし、
  #     後場の始まる12:30までに公開する。当日の日足は前場の値までの途中経過（画面に「前場」と出る）
  #   平日 17:17 JST と、取りこぼしに備えた予備の 18:47 JST: 大引け後。JPX の信用残・品貸料は16時ごろ公表なので17時台で間に合う
  # GitHub 自身の定時実行（下の cron。時刻は同じ）は予備。2026-08-27 ごろから5〜7時間遅れて届くようになり
  #   （9/29 は3回とも6時間12〜33分遅れ）、分をずらしても直らないと報告されている。
  #   遅れて届いた分は、届いた時刻でどの回の分かを決め直す（pipeline/should_build.py）
  schedule:
    - cron: "53 2 * * 1-5" # 11:53 JST
    - cron: "17 8 * * 1-5" # 17:17 JST
    - cron: "47 9 * * 1-5" # 18:47 JST
  workflow_dispatch: # Actions の画面の「Run workflow」で手動実行できる（auto を外したままなら、いつでも作り直す）
    inputs:
      auto:
        description: 外部のタイマーからの自動実行（手で動かすときは外したまま）
        type: boolean
        default: false

permissions:
  contents: write # 実行記録（pipeline/last_run.json）をコミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 自動の実行（外部のタイマー・GitHub の定時実行）は、届いた時刻の回（前場の引け後・大引け後）の
  # データがもう公開済みなら何もしない（予備の時刻の実行は、ふだんここで終わる）。どちらの回の時間帯でもない
  # 時刻に遅れて届いた分も何もしない（pipeline/should_build.py）。手動の「Run workflow」はいつでも作り直す
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          AUTO: ${{ inputs.auto }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # 実行が順番待ちの間に、前の実行が記録を更新していることがあるので、最新の main から読む
          git fetch --depth=1 origin "$BRANCH"
          git show FETCH_HEAD:pipeline/last_run.json | python3 pipeline/should_build.py

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: 回帰テスト
        run: python pipeline/tests/test_momentum.py

      - name: 株価の取得・計算・暗号化
        env:
          MOMENTUM_PASSPHRASE: ${{ secrets.MOMENTUM_PASSPHRASE }}
        run: python pipeline/build.py --out web/public/data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 画面のビルド
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # 公開リポジトリは60日間なにも変化が無いと、定時実行が自動で止められる。
      # 毎日の実行記録をコミットして、止まらないようにする（失敗しても公開は続ける）
      - name: 実行記録のコミット
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/last_run.json
          git commit -m "data: $(jq -r 'if .session == "am" then .as_of + " 前場" elif .session == "intraday" then .as_of + " 途中" else .as_of end' pipeline/last_run.json)" || exit 0
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
