# 毎日の更新: 全銘柄の日足を取り直して計算し、暗号化したデータと画面を GitHub Pages に置く。
# PC の電源は要らない。失敗した日は公開を行わないので、前日のデータがそのまま残る。
name: daily

on:
  schedule:
    # 平日 17:17 JST（= 08:17 UTC）と、取りこぼしに備えた予備の 18:47 JST（= 09:47 UTC）。
    # 毎時0分は定時実行が集中して GitHub に落とされることがある（最初の 17:00 の設定では、
    # 2026-09-28 の実行が行われなかった）。JPX の信用残・品貸料は16時ごろ公表なので17時台で間に合う
    - cron: "17 8 * * 1-5"
    - cron: "47 9 * * 1-5"
  workflow_dispatch: # Actions の画面の「Run workflow」で手動実行できる

permissions:
  contents: write # 実行記録（pipeline/last_run.json）をコミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 定時実行のとき、その日の17時以降に作ったデータがもう公開済みなら何もしない
  # （予備の時刻の実行は、ふだんここで終わる）。朝や日中に手動で作った分は、大引け後の
  # データではないので止めない。手動の「Run workflow」はいつでも作り直す
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          # 実行が順番待ちの間に、前の実行が記録を更新していることがあるので、最新の main から読む
          git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
          built=$(git show FETCH_HEAD:pipeline/last_run.json | jq -r '.built // ""')
          after_close="$(TZ=Asia/Tokyo date +%F) 17:00"
          echo "event=${{ github.event_name }} built=$built after_close=$after_close"
          if [ "${{ github.event_name }}" = "schedule" ] && [[ ! "$built" < "$after_close" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: 回帰テスト
        run: python pipeline/tests/test_momentum.py

      - name: 株価の取得・計算・暗号化
        env:
          MOMENTUM_PASSPHRASE: ${{ secrets.MOMENTUM_PASSPHRASE }}
        run: python pipeline/build.py --out web/public/data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 画面のビルド
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # 公開リポジトリは60日間なにも変化が無いと、定時実行が自動で止められる。
      # 毎日の実行記録をコミットして、止まらないようにする（失敗しても公開は続ける）
      - name: 実行記録のコミット
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/last_run.json
          git commit -m "data: $(jq -r .as_of pipeline/last_run.json)" || exit 0
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
