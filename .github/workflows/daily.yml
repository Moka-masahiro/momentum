# 毎日の更新: 全銘柄の日足を取り直して計算し、暗号化したデータと画面を GitHub Pages に置く。
# PC の電源は要らない。失敗した日は公開を行わないので、前日のデータがそのまま残る。
name: daily

on:
  schedule:
    # 平日 17:00 JST（= 08:00 UTC）。大引けの15:30から余裕を見ている。
    # GitHub の混雑で30分ほど遅れることがある
    - cron: "0 8 * * 1-5"
  workflow_dispatch: # Actions の画面の「Run workflow」で手動実行できる

permissions:
  contents: write # 実行記録（pipeline/last_run.json）をコミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: 回帰テスト
        run: python pipeline/tests/test_momentum.py

      - name: 株価の取得・計算・暗号化
        env:
          MOMENTUM_PASSPHRASE: ${{ secrets.MOMENTUM_PASSPHRASE }}
        run: python pipeline/build.py --out web/public/data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 画面のビルド
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # 公開リポジトリは60日間なにも変化が無いと、定時実行が自動で止められる。
      # 毎日の実行記録をコミットして、止まらないようにする（失敗しても公開は続ける）
      - name: 実行記録のコミット
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/last_run.json
          git commit -m "data: $(jq -r .as_of pipeline/last_run.json)" || exit 0
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
